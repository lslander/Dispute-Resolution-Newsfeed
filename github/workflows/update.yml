name: Päivitä riidanratkaisuseuranta

on:
  schedule:
    # 05:10 UTC joka aamu. Suomen aikaa 07:10 talvella ja 08:10 kesällä.
    # GitHubin cron ei tunne aikavyöhykkeitä, joten kellonaika liikkuu tunnin.
    - cron: "10 5 * * *"
  # Nappi Actions-välilehdellä, jolla ajon voi käynnistää käsin.
  workflow_dispatch:

# Työnkulku kirjoittaa docs-kansion ja state.json-tiedoston takaisin repoon.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v6 ajaa Node 24:llä. Node 20 poistuu runnereista 23.9.2026.
      - uses: actions/checkout@v6
        with:
          # Koko historia, jotta rebase lopussa toimii.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Asenna riippuvuudet
        run: pip install -r requirements.txt

      - name: Aja haku
        # base-url menee RSS-syötteen <link>-kenttään.
        # Muoto on https://KAYTTAJATUNNUS.github.io/REPON-NIMI/
        run: python main.py --base-url "https://lslander.github.io/Dispute-Resolution-Newsfeed/"

      - name: Commitoi tulos
        run: |
          git config user.name "riidanratkaisu-bot"
          git config user.email "actions@github.com"
          git add docs state.json

          # Jos mikään ei muuttunut, commit epäonnistuisi ja kaataisi ajon.
          if git diff --staged --quiet; then
            echo "Ei muutoksia, ei commitoida."
            exit 0
          fi
          git commit -m "Päivitä feed $(date -u +%Y-%m-%d)"

          # Repoon on voinut tulla uusi commit sillä aikaa kun haku pyöri.
          # Silloin pelkkä push hylätään. Haetaan muutokset alle ja yritetään
          # kolmesti, koska sama voi toistua.
          for yritys in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Työnnetty onnistuneesti."
              exit 0
            fi
            echo "Työntö ei onnistunut (yritys $yritys). Odotetaan."
            sleep 10
          done
          echo "Työntö epäonnistui kolmesti."
          exit 1
